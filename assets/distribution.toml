schema_version = 1

[distribution]
name = "wolf3d-revive"
purpose = "Distribution eligibility and provenance policy; not an R2 runtime content manifest"
default_policy = "deny"

[limits]
max_files = 4096
max_file_size = 67108864
max_total_size = 536870912

[profiles.original-standalone]
description = "Future independent game package; commercial Wolfenstein data and uncleared material are excluded"
required_assets = ["gpl-v2-notice", "emu8950-mit-notice"]

[[asset]]
id = "gpl-v2-notice"
path = "COPYING"
type = "licence-notice"
origin = "GNU General Public License version 2 text already tracked by the project"
creator = "Free Software Foundation, Inc."
license = "GPL-2.0-only"
redistribution = "approved"
evidence = "COPYING"
sha256 = "edaef632cbb643e4e7a221717a6c441a4c1a7c918e6e4d56debc3d8739b233f6"
attribution_required = true
notice = "Include the complete GPL version 2 licence text and comply with the applicable source-code obligations."
notice_path = "COPYING"
profiles = ["original-standalone"]
notes = "Integrity is pinned to the reviewed repository file; the digest is not legal proof."

[[asset]]
id = "emu8950-mit-notice"
path = "third_party/emu8950/LICENSE"
type = "third-party-licence-notice"
origin = "emu8950 upstream commit f82a22e80b68820f263084aa8506b12eb1c9b4dd"
creator = "Mitsutaka Okazaki"
license = "MIT"
redistribution = "approved"
evidence = "third_party/emu8950/README.wolf3d.md"
sha256 = "e0db14654c1f977ec384c3fad3baf6e1f4d21c8369946823bbb6d4e06ebc372b"
attribution_required = true
notice = "Retain the emu8950 copyright notice and MIT permission terms when its code is included."
notice_path = "third_party/emu8950/LICENSE"
profiles = ["original-standalone"]
notes = "The notice is approved; inclusion of a future binary still requires confirmation that emu8950 is linked."

[[asset]]
id = "active-platform-source"
prefix = "src/platform/"
type = "source-code"
origin = "Wolf3D Revive project code"
creator = "Wolf3D Revive contributors"
license = "GPL-2.0-only"
redistribution = "development-only"
evidence = "docs/LICENSING.md"
attribution_required = false
profiles = ["original-standalone"]
notes = "Code licensing is recorded separately from game-asset clearance; source is not a standalone payload asset."

